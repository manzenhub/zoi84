# Pages CMS (https://app.pagescms.org) – forme za uređivanje sadržaja zoi84.ba
media:
  input: src/uploads
  output: /uploads

content:
  - name: novosti
    label: Novosti i obavijesti
    type: collection
    path: src/novosti
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, vrsta]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Naslov, type: string, required: true }
      - { name: date, label: Datum objave, type: date, required: true }
      - name: vrsta
        label: Vrsta objave
        type: select
        required: true
        default: novost
        options:
          values:
            - { value: novost, label: Novost }
            - { value: oglas, label: Oglas }
            - { value: nabavka, label: Javna nabavka }
            - { value: akti, label: Akti }
      - name: dokumenti
        label: Prilozi (PDF, Word…)
        type: object
        list: true
        fields:
          - { name: naziv, label: Naziv priloga, type: string }
          - { name: fajl, label: Fajl, type: file }
      - { name: body, label: Tekst objave, type: rich-text, description: "Prvi paragraf se prikazuje kao uvod." }

  - name: natjecaji
    label: Konkursi i javni pozivi
    type: collection
    path: src/natjecaji
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, rok, vrsta]
      primary: title
      sort: [date, rok]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Naslov, type: string, required: true }
      - name: vrsta
        label: Vrsta
        type: select
        required: true
        default: zap
        options:
          values:
            - { value: zap, label: Zapošljavanje }
            - { value: poziv, label: Javni poziv }
            - { value: zakup, label: Zakup prostora }
      - { name: date, label: Datum objave, type: date, required: true }
      - { name: rok, label: Rok za prijave, type: date, required: true, description: "Nakon roka konkurs automatski prelazi u Zatvorene." }
      - { name: sazetak, label: Kratki opis (na kartici), type: text }
      - name: dokumenti
        label: Dokumentacija
        type: object
        list: true
        fields:
          - { name: naziv, label: Naziv dokumenta, type: string }
          - { name: fajl, label: Fajl, type: file }
      - { name: body, label: Detaljan tekst (u prozoru „Detaljnije“), type: rich-text }

  - name: dokumenti
    label: Dokumenti
    type: collection
    path: src/dokumenti
    filename: "{primary}.md"
    view:
      fields: [title, kategorija, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Naziv dokumenta / grupe, type: string, required: true }
      - name: kategorija
        label: Kategorija
        type: select
        required: true
        options:
          values:
            - { value: akti, label: Statut i opći akti }
            - { value: odluke, label: Odluke i rješenja }
            - { value: izvjestaji, label: Izvještaji }
            - { value: planovi, label: Planovi i programi }
            - { value: nabavke, label: Javne nabavke }
            - { value: cjenovnici, label: Cjenovnici }
            - { value: pristup, label: Pristup informacijama }
      - { name: date, label: Datum, type: date, required: true }
      - name: fajlovi
        label: Fajlovi
        description: "Možeš dodati više fajlova odjednom. Svaki se prikazuje kao zaseban dokument s istom kategorijom i datumom. Ako nazivu ostaviš prazno, koristi se naslov gore (za jedan fajl) ili ime fajla (za više). Vrsta i veličina se računaju automatski."
        type: object
        list: true
        fields:
          - { name: fajl, label: Fajl, type: file }
          - { name: naziv, label: Naziv (neobavezno), type: string }

  - name: ulaganja
    label: Kapitalna ulaganja
    type: collection
    path: src/ulaganja
    filename: "{fields.centar}-{primary}.md"
    view:
      fields: [title, centar, godina]
      primary: title
      sort: [godina, title]
      default:
        sort: godina
        order: desc
    fields:
      - { name: title, label: Naziv projekta, type: string, required: true }
      - name: centar
        label: Olimpijski centar
        type: select
        required: true
        options:
          values:
            - { value: bjelasnica, label: Bjelašnica – Igman }
            - { value: zetra, label: Zetra }
      - { name: godina, label: Godina, type: number, required: true }
      - { name: opis, label: Opis (u prozoru), type: text, description: "Prazan red između paragrafa pravi novi paragraf." }
      - { name: title_en, label: Naziv (engleski), type: string }
      - { name: opis_en, label: Opis (engleski), type: text }
      - { name: redoslijed, label: Redoslijed unutar iste godine, type: number, description: "Neobavezno. Manji broj ide prvi." }

  - name: uprava
    label: Uprava
    type: file
    path: src/_data/uprava.json
    format: json
    fields:
      - name: direktor
        label: Direktor
        type: object
        fields:
          - { name: ime, label: Ime i prezime, type: string }
          - { name: funkcija, label: Funkcija, type: string }
          - { name: funkcija_en, label: Funkcija (engleski), type: string }
          - { name: foto, label: Fotografija, type: image }
          - { name: bio, label: Biografija, type: text, description: "Prazan red između paragrafa pravi novi paragraf." }
          - { name: bio_en, label: Biografija (engleski), type: text }
      - name: clanovi
        label: Rukovodstvo (lista ispod direktora)
        type: object
        list: true
        fields:
          - { name: ime, label: Ime i prezime, type: string }
          - { name: funkcija, label: Funkcija, type: string }
          - { name: funkcija_en, label: Funkcija (engleski), type: string }
